<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EC">
<title>Minha Rotina</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EC; --ink:#2B2440; --card:#FFFFFF; --muted:#5F5878; --line:#E8DFCB;
  --a0:#D64532; --t0:#FFE4DF; --a1:#0F7A60; --t1:#DDF4EC; --a2:#3A67CF; --t2:#E1EAFD; --a3:#7444C9; --t3:#EBE1FB;
  --gold:#FFB627; --shadow:0 4px 0 rgba(43,36,64,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1D1930; --ink:#F4EFFF; --card:#2A2542; --muted:#BDB4D9; --line:#3D3760;
    --t0:#3F2530; --t1:#1E3A36; --t2:#232F52; --t3:#35284F; --shadow:0 4px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1D1930; --ink:#F4EFFF; --card:#2A2542; --muted:#BDB4D9; --line:#3D3760;
  --t0:#3F2530; --t1:#1E3A36; --t2:#232F52; --t3:#35284F; --shadow:0 4px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:16px 14px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:'Fredoka',system-ui,sans-serif;margin:0}

/* topo */
.top{display:flex;align-items:center;gap:12px}
.cat{width:72px;height:72px;flex-shrink:0}
.cat .body{fill:var(--cat,#F2A65A)}
.hello{flex-grow:1;min-width:0}
.hello h1{font-size:28px;line-height:1.1;overflow-wrap:anywhere}
.hello .date{font-size:15px;color:var(--muted);text-transform:capitalize}
.iconbtn{width:48px;height:48px;border-radius:16px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn:active{transform:translateY(2px)}
svg[data-mood="0"] :is(.for1,.for2){display:none}
svg[data-mood="1"] :is(.for0,.for2){display:none}
svg[data-mood="2"] :is(.for0,.for1){display:none}

/* cartões */
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog-head h2{font-size:20px}
.prog-head .count{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:600}
.bar{height:22px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 8px;position:relative}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3A67CF,#7444C9);border-radius:999px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.bar.full i{background:var(--gold)}
.msg{font-size:16px;color:var(--muted)}
.streak{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:16px}
.week{display:flex;justify-content:space-between;gap:4px;margin-top:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted);flex:1}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--bg)}
.dot.part{background:var(--t2);border-color:var(--a2)}
.dot.full{background:var(--gold);border-color:#B57A00}
.day.today .dot{outline:3px solid var(--a3);outline-offset:2px}
.day.today span{color:var(--ink)}

/* próxima missão */
.mission{background:var(--a3);color:#fff;border-color:transparent}
.mission .lbl{font-size:14px;opacity:.9;text-transform:uppercase;letter-spacing:.06em}
.mission .task{font-family:'Fredoka',sans-serif;font-weight:600;font-size:24px;line-height:1.15;margin:4px 0 12px}
.bigbtn{width:100%;min-height:56px;border-radius:18px;border:0;background:#fff;color:#4B2A96;font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.mission.done{background:var(--gold);color:#2B2440}
.mission.done .bigbtn{display:none}

/* abas */
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tab{min-height:48px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:16px;padding:6px 8px;position:relative;font-family:'Fredoka',sans-serif;font-weight:600}
.tab[aria-selected="true"]{background:var(--a2);border-color:var(--a2);color:#fff}
.tab .hoje{position:absolute;top:-8px;right:8px;background:var(--gold);color:#2B2440;font-size:11px;border-radius:999px;padding:1px 8px;font-family:'Nunito',sans-serif;font-weight:800}
.tabtitle{font-size:22px}
.tabsub{font-size:15px;color:var(--muted);margin-top:2px}
.note{background:#FFE29A;color:#2B2440;border:2px dashed #2B2440;border-radius:20px;padding:12px 16px;font-size:17px;display:flex;gap:10px;align-items:center}

/* lista */
.list{display:flex;flex-direction:column;gap:9px}
.cathead{align-self:flex-start;color:#fff;border-radius:999px;padding:4px 18px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;margin-top:6px}
.row{width:100%;min-height:60px;border-radius:18px;padding:8px 12px;display:flex;align-items:center;gap:12px;text-align:left;background:var(--t);border:2px solid var(--a);color:var(--ink);transition:transform .12s,opacity .2s}
.row:active{transform:scale(.98)}
.row .n{width:36px;height:36px;border-radius:50%;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px}
.row .txt{flex-grow:1;font-size:18px;line-height:1.2}
.row .extra{display:block;font-size:15px;margin-top:3px;font-weight:700}
.row .box{width:32px;height:32px;border-radius:10px;background:#fff;border:3px solid var(--a);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.row .box svg{opacity:0;transform:scale(.3);transition:all .2s}
.row[aria-pressed="true"]{opacity:.62}
.row[aria-pressed="true"] .box{background:var(--a)}
.row[aria-pressed="true"] .box svg{opacity:1;transform:scale(1)}
.row.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.c0{--a:var(--a0);--t:var(--t0)} .c1{--a:var(--a1);--t:var(--t1)} .c2{--a:var(--a2);--t:var(--t2)} .c3{--a:var(--a3);--t:var(--t3)}

/* rodapé */
.foot{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:6px}
.clear{min-height:52px;padding:0 28px;border-radius:999px;border:2px solid var(--a0);background:transparent;color:var(--a0);font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;display:flex;align-items:center;gap:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .clear{color:#FF9A8A;border-color:#FF9A8A}}
.foot small{color:var(--muted);font-size:14px;text-align:center}

/* modal, toast, confete */
.overlay{position:fixed;inset:0;background:rgba(20,15,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow-y:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:26px}
.sheet p{margin:0;color:var(--muted);font-size:16px}
.input{min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:20px;padding:0 16px;width:100%}
.input:focus{outline:3px solid var(--a3);outline-offset:1px}
.swatches{display:flex;gap:12px}
.sw{width:52px;height:52px;border-radius:50%;border:4px solid transparent;flex-shrink:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.btnrow{display:flex;gap:10px}
.btn{flex:1;min-height:52px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px}
.btn.primary{background:var(--a3);border-color:var(--a3);color:#fff}
.btn.danger{background:var(--a0);border-color:var(--a0);color:#fff}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px}
.prow .pick{flex-grow:1;min-height:52px;border-radius:16px;border:2px solid var(--line);background:var(--bg);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:18px;text-align:left}
.prow .pick[aria-current="true"]{border-color:var(--a3);background:var(--t3)}
.prow .pick i{width:22px;height:22px;border-radius:50%;flex-shrink:0}
.prow .del{width:52px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--a0)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 12px 10px 20px;display:flex;align-items:center;gap:12px;z-index:60;font-size:16px;max-width:92%}
.toast button{border:0;background:var(--gold);color:#2B2440;border-radius:999px;min-height:40px;padding:0 16px;font-family:'Fredoka',sans-serif;font-weight:600}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="modal"></div>
<div id="toastbox"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function(){
'use strict';

/* dados */
var ROUTINES = {
  seg_qua: {
    tab: 'Seg e Qua', title: 'Segunda e Quarta', sub: 'Dias de futebol! Bora cumprir a missão?',
    items: ['Arrumar a cama','Ir pra escola','Trocar de roupa (futebol)','Arrumar mesa do almoço','Almoçar','Lavar louça','Arrumar cozinha','Limpar porta prato','Escovar os dentes','Ver os lixos se precisa trocar','Limpar areia dos gatos','Fazer atividade de casa','Estudar','Ir pro futebol','Arrumar mesa do jantar','Jantar','Lavar louça','Limpar cozinha','Tomar banho','Escovar dente','Ir deitar até 21h']
  },
  ter_qui_sex: {
    tab: 'Ter, Qui e Sex', title: 'Terça, Quinta e Sexta', sub: 'Missão do dia: cada tarefa feita ganha um check!',
    items: ['Arrumar a cama','Ir pra escola','Trocar de roupa','Arrumar mesa do almoço','Almoçar','Lavar louça','Arrumar cozinha','Limpar porta prato','Escovar os dentes','Ver os lixos se precisa trocar','Limpar areia dos gatos','Fazer atividade de casa','Estudar','Arrumar mesa do jantar','Jantar','Lavar louça','Limpar cozinha','Tomar banho','Escovar dente','Ir deitar até 21h']
  },
  fds: {
    tab: 'Fim de semana', title: 'Final de semana', sub: 'Missão do dia: cada tarefa feita ganha um check!',
    note: 'Usar o celular com sabedoria, tem coisas mais importantes para fazer',
    items: ['Arrumar a cama','Trocar de roupa','Tomar café da manhã','Limpar o que sujou','Arrumar mesa do almoço','Almoçar','Lavar louça','Arrumar cozinha','Limpar porta prato','Escovar os dentes','Ver os lixos se precisa trocar','Limpar areia dos gatos','Fazer atividade de casa','Estudar','Arrumar mesa do jantar','Jantar','Lavar louça','Limpar cozinha','Tomar banho','Escovar dente','Ir deitar até 23h']
  }
};
var COMB_GROUPS = [
  { title: 'Proatividade', cls: 'c1', rows: [
    { t: 'Ajudar nas atividades em casa sem precisar pedir' },
    { t: 'Ajudar a limpar a casa 1 vez na semana' },
    { t: 'Não ignorar se precisa fazer algo.', x: 'Exemplo: viu sujeira e não foi você que fez? Limpe do mesmo jeito!' } ] },
  { title: 'Responsabilidade', cls: 'c2', rows: [
    { t: 'Tirar os lixos e levar lá embaixo' },
    { t: 'Avisar com antecedência se precisa comprar algo' },
    { t: 'Tirar nota boa' },
    { t: 'Cuidar dos gatos' } ] },
  { title: 'Respeito', cls: 'c0', rows: [
    { t: 'Sempre falar a verdade' },
    { t: 'Não brigar ou ser grosseiro' } ] }
];
var COMB_FLAT = [];
COMB_GROUPS.forEach(function(g){ g.rows.forEach(function(r){ COMB_FLAT.push({ t: r.t, x: r.x, cls: g.cls, cat: g.title }); }); });
ROUTINES.comb = { tab: 'Obrigatório', title: 'Obrigatório', sub: 'Os combinados da casa', combinados: true, items: COMB_FLAT.map(function(r){ return r.t; }) };

var TAB_ORDER = ['seg_qua','ter_qui_sex','fds','comb'];
var CATS = [ { n:'Laranja', c:'#F2A65A' }, { n:'Azul', c:'#7AA7F0' }, { n:'Lilás', c:'#C58BE8' }, { n:'Verde', c:'#6FCFA8' } ];
var WD = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
var WD1 = ['D','S','T','Q','Q','S','S'];
var MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* armazenamento (com try/catch: pode vir vazio) */
var store = load();
function load(){
  try { var s = localStorage.getItem('rotina:v1'); if (s) { var o = JSON.parse(s); if (o && o.profiles) return o; } } catch(e){}
  return { current: null, profiles: {}, sound: true };
}
function save(){ try { localStorage.setItem('rotina:v1', JSON.stringify(store)); } catch(e){} }

/* datas */
function dkey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function typeOf(d){ var w = d.getDay(); if (w === 0 || w === 6) return 'fds'; if (w === 1 || w === 3) return 'seg_qua'; return 'ter_qui_sex'; }
function emptyChecks(){
  var c = {};
  TAB_ORDER.forEach(function(k){ c[k] = ROUTINES[k].items.map(function(){ return false; }); });
  return c;
}
function cur(){ return store.profiles[store.current]; }

/* estado de tela */
var activeTab = typeOf(new Date());
var lastPop = -1;

/* helpers de DOM */
function $(id){ return document.getElementById(id); }
function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
var SVGNS = 'http://www.w3.org/2000/svg';
function svgIcon(html, w, h, vb){
  var s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('width', w); s.setAttribute('height', h); s.setAttribute('viewBox', vb || '0 0 24 24');
  s.setAttribute('aria-hidden', 'true');
  s.innerHTML = html;
  return s;
}
var ICON_CHECK = '<path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>';
var ICON_STAR = '<path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z" fill="#FFB627" stroke="#2B2440" stroke-width="1.6" stroke-linejoin="round"/>';
var ICON_FLAME = '<path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-10z" fill="#FF8A2B" stroke="#2B2440" stroke-width="1.6" stroke-linejoin="round"/>';
var ICON_MENU = '<circle cx="12" cy="6" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="18" r="2" fill="currentColor"/>';
var ICON_TRASH = '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
var ICON_RESET = '<path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';

/* som e vibração */
var actx;
function tone(f, d, delay, type){
  if (!store.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    var t = actx.currentTime + (delay || 0);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + d + 0.03);
  } catch(e){}
}
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }
function confetti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c = $('confetti'), ctx = c.getContext('2d');
  c.width = window.innerWidth; c.height = window.innerHeight;
  var cols = ['#D64532','#0F7A60','#3A67CF','#7444C9','#FFB627','#FF8A2B'];
  var ps = [];
  for (var i = 0; i < 130; i++) ps.push({ x: c.width/2, y: c.height*0.4, vx: (Math.random()-0.5)*14, vy: -Math.random()*13-3, s: 6+Math.random()*7, c: cols[i % cols.length], r: Math.random()*6, vr: (Math.random()-0.5)*0.4 });
  var f = 0;
  (function step(){
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(function(p){
      p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.fillRect(-p.s/2, -p.s/3, p.s, p.s*0.66); ctx.restore();
    });
    if (++f < 160) requestAnimationFrame(step); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}
function fanfare(){ [523,659,784,1046].forEach(function(f, i){ tone(f, 0.3, i*0.12, 'triangle'); }); buzz([60,40,60,40,120]); confetti(); }

/* lógica */
function count(tab){ return cur().checks[tab].filter(Boolean).length; }
function total(tab){ return cur().checks[tab].length; }
function pctOf(tab){ return Math.round(100 * count(tab) / total(tab)); }
function todayType(){ return typeOf(new Date()); }
function updateHistory(){
  var p = cur(), k = dkey(new Date());
  p.history = p.history || {};
  p.history[k] = pctOf(todayType());
  var keys = Object.keys(p.history).sort();
  while (keys.length > 40) delete p.history[keys.shift()];
}
function streak(){
  var h = cur().history || {}, d = new Date(), n = 0;
  if (h[dkey(d)] !== 100) d.setDate(d.getDate() - 1);
  while (h[dkey(d)] === 100) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function rollover(){
  var p = cur(); if (!p) return false;
  var t = dkey(new Date());
  if (p.date !== t) {
    p.date = t; p.checks = emptyChecks(); save();
    activeTab = todayType();
    return true;
  }
  return false;
}
function toggle(tab, i){
  var p = cur(), was = p.checks[tab].every(Boolean);
  p.checks[tab][i] = !p.checks[tab][i];
  updateHistory(); save();
  if (p.checks[tab][i]) { tone(660, 0.12); tone(880, 0.16, 0.09); buzz(25); } else { tone(320, 0.12); }
  lastPop = i;
  render();
  if (!was && p.checks[tab].every(Boolean)) fanfare();
}
function message(pct){
  if (pct === 0) return 'Bora começar a missão!';
  if (pct < 25) return 'Boa largada!';
  if (pct < 50) return 'Tá indo muito bem!';
  if (pct < 75) return 'Passou da metade!';
  if (pct < 100) return 'Quase lá, falta pouco!';
  return 'Missão cumprida! Craque da casa!';
}

/* mascote */
function catSvg(mood){
  var s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('class', 'cat'); s.setAttribute('viewBox', '0 0 96 96'); s.setAttribute('data-mood', String(mood)); s.setAttribute('aria-hidden', 'true');
  s.innerHTML =
    '<path class="body" d="M18 40 L20 12 L40 26 Q48 24 56 26 L76 12 L78 40 Q84 52 78 64 Q70 82 48 82 Q26 82 18 64 Q12 52 18 40 Z" stroke="#2B2440" stroke-width="3" stroke-linejoin="round"/>' +
    '<g class="for0"><path d="M30 50 Q36 54 42 50 M54 50 Q60 54 66 50" fill="none" stroke="#2B2440" stroke-width="3" stroke-linecap="round"/><path d="M42 66 L54 66" stroke="#2B2440" stroke-width="2.5" stroke-linecap="round"/></g>' +
    '<g class="for1"><circle cx="36" cy="50" r="4.5" fill="#2B2440"/><circle cx="60" cy="50" r="4.5" fill="#2B2440"/><path d="M48 63 Q44 69 39 66 M48 63 Q52 69 57 66" fill="none" stroke="#2B2440" stroke-width="2.5" stroke-linecap="round"/></g>' +
    '<g class="for2"><path d="M36 44 l2.2 4.4 4.8.6-3.5 3.3.9 4.8-4.4-2.4-4.4 2.4.9-4.8-3.5-3.3 4.8-.6z M60 44 l2.2 4.4 4.8.6-3.5 3.3.9 4.8-4.4-2.4-4.4 2.4.9-4.8-3.5-3.3 4.8-.6z" fill="#FFB627" stroke="#2B2440" stroke-width="1.2" stroke-linejoin="round"/><path d="M38 62 Q48 76 58 62 Z" fill="#D64532" stroke="#2B2440" stroke-width="2.5" stroke-linejoin="round"/></g>' +
    '<path d="M44 58 L52 58 L48 63 Z" fill="#D64532" stroke="#2B2440" stroke-width="2" stroke-linejoin="round" class="for1 for2"/>' +
    '<path d="M14 56 L30 59 M14 66 L30 64 M82 56 L66 59 M82 66 L66 64" fill="none" stroke="#2B2440" stroke-width="2.5" stroke-linecap="round"/>';
  return s;
}

/* telas */
function render(){
  var app = $('app');
  app.textContent = '';
  var p = cur();
  if (!p) return;
  document.documentElement.style.setProperty('--cat', p.color);
  var tt = todayType(), pct = pctOf(tt);
  var now = new Date();

  /* topo */
  var top = el('div', 'top');
  top.appendChild(catSvg(pct === 100 ? 2 : (pct === 0 ? 0 : 1)));
  var hello = el('div', 'hello');
  hello.appendChild(el('h1', '', 'Oi, ' + p.name + '!'));
  hello.appendChild(el('div', 'date', WD[now.getDay()] + ', ' + now.getDate() + ' de ' + MONTHS[now.getMonth()]));
  top.appendChild(hello);
  var mb = el('button', 'iconbtn'); mb.setAttribute('aria-label', 'Menu'); mb.appendChild(svgIcon(ICON_MENU, 24, 24));
  mb.onclick = openMenu; top.appendChild(mb);
  app.appendChild(top);

  /* progresso */
  var pc = el('div', 'card');
  var ph = el('div', 'prog-head');
  ph.appendChild(el('h2', '', 'Missão de hoje'));
  ph.appendChild(el('div', 'count', count(tt) + ' de ' + total(tt)));
  pc.appendChild(ph);
  var bar = el('div', 'bar' + (pct === 100 ? ' full' : ''));
  bar.setAttribute('role', 'progressbar'); bar.setAttribute('aria-valuenow', pct); bar.setAttribute('aria-valuemin', 0); bar.setAttribute('aria-valuemax', 100);
  var fill = document.createElement('i'); fill.style.width = pct + '%'; bar.appendChild(fill);
  pc.appendChild(bar);
  pc.appendChild(el('div', 'msg', message(pct)));
  var st = streak();
  var sr = el('div', 'streak');
  sr.appendChild(svgIcon(ICON_FLAME, 24, 24));
  sr.appendChild(el('span', '', st === 0 ? 'Complete hoje e comece sua sequência!' : (st === 1 ? '1 dia seguido com tudo feito' : st + ' dias seguidos com tudo feito')));
  pc.appendChild(sr);
  var week = el('div', 'week');
  for (var i = 6; i >= 0; i--) {
    var d = new Date(); d.setDate(d.getDate() - i);
    var v = (p.history || {})[dkey(d)] || 0;
    var day = el('div', 'day' + (i === 0 ? ' today' : ''));
    var dot = el('div', 'dot' + (v === 100 ? ' full' : (v > 0 ? ' part' : '')));
    if (v === 100) dot.appendChild(svgIcon(ICON_STAR, 18, 18));
    else if (v > 0) dot.appendChild(el('span', '', v + '%')), dot.lastChild.style.fontSize = '10px';
    day.appendChild(dot); day.appendChild(el('span', '', WD1[d.getDay()]));
    week.appendChild(day);
  }
  pc.appendChild(week);
  app.appendChild(pc);

  /* abas */
  var tabs = el('div', 'tabs'); tabs.setAttribute('role', 'tablist');
  TAB_ORDER.forEach(function(k){
    var b = el('button', 'tab', ROUTINES[k].tab);
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(k === activeTab));
    if (k === tt) b.appendChild(el('span', 'hoje', 'hoje'));
    b.onclick = function(){ activeTab = k; lastPop = -1; render(); };
    tabs.appendChild(b);
  });
  app.appendChild(tabs);

  /* próxima missão */
  var R = ROUTINES[activeTab], arr = p.checks[activeTab];
  var nextIdx = arr.indexOf(false);
  var mc = el('div', 'card mission' + (nextIdx === -1 ? ' done' : ''));
  if (nextIdx === -1) {
    mc.appendChild(el('div', 'lbl', R.combinados ? 'Combinados' : 'Lista completa'));
    mc.appendChild(el('div', 'task', R.combinados ? 'Todos os combinados cumpridos hoje!' : 'Tudo feito nessa lista! Parabéns!'));
  } else {
    mc.appendChild(el('div', 'lbl', R.combinados ? 'Próximo combinado' : 'Próxima missão'));
    mc.appendChild(el('div', 'task', R.items[nextIdx]));
    var bb = el('button', 'bigbtn', 'Feito!');
    bb.onclick = function(){ toggle(activeTab, nextIdx); };
    mc.appendChild(bb);
  }
  app.appendChild(mc);

  /* título da aba */
  var th = el('div');
  th.appendChild(el('h3', 'tabtitle', R.title));
  th.appendChild(el('div', 'tabsub', R.sub + '  ·  ' + count(activeTab) + ' de ' + total(activeTab)));
  app.appendChild(th);
  if (R.note) {
    var nt = el('div', 'note');
    nt.appendChild(svgIcon(ICON_STAR, 26, 26));
    nt.appendChild(el('div', '', R.note));
    app.appendChild(nt);
  }

  /* lista */
  var list = el('div', 'list');
  if (R.combinados) {
    var idx = 0;
    COMB_GROUPS.forEach(function(g){
      var ch = el('div', 'cathead', g.title);
      ch.style.background = 'var(--a' + g.cls.slice(1) + ')';
      list.appendChild(ch);
      g.rows.forEach(function(r){ list.appendChild(makeRow(activeTab, idx, r.t, g.cls, r.x, idx + 1)); idx++; });
    });
  } else {
    R.items.forEach(function(t, i){ list.appendChild(makeRow(activeTab, i, t, 'c' + (i % 4), null, i + 1)); });
  }
  app.appendChild(list);

  /* rodapé */
  var foot = el('div', 'foot');
  var cb = el('button', 'clear'); cb.appendChild(svgIcon(ICON_RESET, 22, 22)); cb.appendChild(el('span', '', 'Limpar o dia'));
  cb.onclick = confirmClear;
  foot.appendChild(cb);
  foot.appendChild(el('small', '', 'A lista limpa sozinha todo dia. Use o botão só se quiser começar de novo.'));
  app.appendChild(foot);
  lastPop = -1;
}
function makeRow(tab, i, text, cls, extra, num){
  var done = cur().checks[tab][i];
  var b = el('button', 'row ' + cls + (lastPop === i ? ' pop' : ''));
  b.setAttribute('aria-pressed', String(!!done));
  b.appendChild(el('div', 'n', String(num)));
  var tx = el('div', 'txt', text);
  if (extra) tx.appendChild(el('span', 'extra', extra));
  b.appendChild(tx);
  var bx = el('div', 'box'); bx.appendChild(svgIcon(ICON_CHECK, 22, 22));
  b.appendChild(bx);
  b.onclick = function(){ toggle(tab, i); };
  return b;
}

/* modais */
function closeModal(){ $('modal').textContent = ''; }
function openSheet(build, dismissible){
  var ov = el('div', 'overlay'), sh = el('div', 'sheet');
  sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true');
  build(sh);
  ov.appendChild(sh);
  if (dismissible !== false) ov.addEventListener('click', function(e){ if (e.target === ov) closeModal(); });
  $('modal').textContent = ''; $('modal').appendChild(ov);
}
function setupModal(canCancel){
  var color = CATS[0].c;
  openSheet(function(sh){
    sh.appendChild(el('h2', '', 'Quem vai usar?'));
    sh.appendChild(el('p', '', 'Escreva o nome e escolha a cor do gatinho.'));
    var inp = document.createElement('input');
    inp.className = 'input'; inp.type = 'text'; inp.maxLength = 20; inp.placeholder = 'Nome'; inp.setAttribute('aria-label', 'Nome');
    sh.appendChild(inp);
    var sws = el('div', 'swatches');
    CATS.forEach(function(c, i){
      var b = el('button', 'sw'); b.style.background = c.c; b.setAttribute('aria-label', c.n); b.setAttribute('aria-pressed', String(i === 0));
      b.onclick = function(){ color = c.c; Array.prototype.forEach.call(sws.children, function(x){ x.setAttribute('aria-pressed', 'false'); }); b.setAttribute('aria-pressed', 'true'); };
      sws.appendChild(b);
    });
    sh.appendChild(sws);
    var row = el('div', 'btnrow');
    if (canCancel) { var cn = el('button', 'btn', 'Cancelar'); cn.onclick = closeModal; row.appendChild(cn); }
    var ok = el('button', 'btn primary', 'Começar!');
    function go(){
      var name = inp.value.trim();
      if (!name) { inp.focus(); return; }
      var id = 'p' + Date.now();
      store.profiles[id] = { name: name, color: color, date: dkey(new Date()), checks: emptyChecks(), history: {} };
      store.current = id; save(); closeModal(); activeTab = todayType(); render();
    }
    ok.onclick = go; row.appendChild(ok);
    sh.appendChild(row);
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
    setTimeout(function(){ inp.focus(); }, 60);
  }, canCancel);
}
function openMenu(){
  openSheet(function(sh){
    sh.appendChild(el('h2', '', 'Menu'));
    var pl = el('div', 'plist');
    Object.keys(store.profiles).forEach(function(id){
      var pr = store.profiles[id], row = el('div', 'prow');
      var pk = el('button', 'pick'); var dot = document.createElement('i'); dot.style.background = pr.color;
      pk.appendChild(dot); pk.appendChild(el('span', '', pr.name));
      if (id === store.current) pk.setAttribute('aria-current', 'true');
      pk.onclick = function(){ store.current = id; save(); rollover(); closeModal(); activeTab = todayType(); render(); };
      row.appendChild(pk);
      var dl = el('button', 'del'); dl.setAttribute('aria-label', 'Apagar ' + pr.name); dl.appendChild(svgIcon(ICON_TRASH, 22, 22));
      dl.onclick = function(){ confirmDelete(id); };
      row.appendChild(dl);
      pl.appendChild(row);
    });
    sh.appendChild(pl);
    var add = el('button', 'btn', 'Adicionar criança'); add.onclick = function(){ setupModal(true); };
    sh.appendChild(add);
    var sd = el('button', 'btn', store.sound ? 'Som: ligado' : 'Som: desligado');
    sd.onclick = function(){ store.sound = !store.sound; save(); sd.textContent = store.sound ? 'Som: ligado' : 'Som: desligado'; tone(660, 0.12); };
    sh.appendChild(sd);
    var cl = el('button', 'btn primary', 'Fechar'); cl.onclick = closeModal;
    sh.appendChild(cl);
  });
}
function confirmDelete(id){
  var pr = store.profiles[id];
  openSheet(function(sh){
    sh.appendChild(el('h2', '', 'Apagar ' + pr.name + '?'));
    sh.appendChild(el('p', '', 'Isso apaga os checks e a sequência desse perfil.'));
    var row = el('div', 'btnrow');
    var no = el('button', 'btn', 'Voltar'); no.onclick = openMenu;
    var yes = el('button', 'btn danger', 'Apagar');
    yes.onclick = function(){
      delete store.profiles[id];
      var ids = Object.keys(store.profiles);
      store.current = ids.length ? (store.current === id ? ids[0] : store.current) : null;
      save(); closeModal();
      if (!store.current) setupModal(false); else render();
    };
    row.appendChild(no); row.appendChild(yes); sh.appendChild(row);
  });
}
function confirmClear(){
  openSheet(function(sh){
    sh.appendChild(el('h2', '', 'Limpar o dia?'));
    sh.appendChild(el('p', '', 'Todos os checks das listas voltam para vazio. Dá para desfazer logo depois.'));
    var row = el('div', 'btnrow');
    var no = el('button', 'btn', 'Cancelar'); no.onclick = closeModal;
    var yes = el('button', 'btn danger', 'Limpar');
    yes.onclick = function(){
      var p = cur(), k = dkey(new Date());
      var snap = { checks: JSON.parse(JSON.stringify(p.checks)), hist: (p.history || {})[k] };
      p.checks = emptyChecks(); p.history = p.history || {}; delete p.history[k];
      save(); closeModal(); tone(300, 0.15); render();
      toast('Dia limpo!', 'Desfazer', function(){
        p.checks = snap.checks; if (snap.hist != null) p.history[k] = snap.hist;
        save(); render();
      });
    };
    row.appendChild(no); row.appendChild(yes); sh.appendChild(row);
  });
}
var toastTimer;
function toast(text, actionLabel, action){
  var box = $('toastbox'); box.textContent = '';
  var t = el('div', 'toast'); t.appendChild(el('span', '', text));
  if (actionLabel) { var b = el('button', '', actionLabel); b.onclick = function(){ box.textContent = ''; action(); }; t.appendChild(b); }
  box.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ box.textContent = ''; }, 7000);
}

/* início */
function tick(){ if (cur() && rollover()) render(); }
document.addEventListener('visibilitychange', function(){ if (!document.hidden) tick(); });
setInterval(tick, 30000);

if (!store.current || !store.profiles[store.current]) {
  var ids = Object.keys(store.profiles);
  store.current = ids.length ? ids[0] : null;
}
if (store.current) { rollover(); render(); } else { setupModal(false); }
})();
</script>
</body>
